<svg xmlns="http://www.w3.org/2000/svg" class="kjd kjd-sys" viewBox="-4 -4 1040 320" width="1040" height="320" role="img" aria-labelledby="kjdSysTitle kjdSysDesc">
<title id="kjdSysTitle">The System - 지시 1건이 산출물 1건이 되는 길</title>
<desc id="kjdSysDesc">지시 1건을 총괄 기획실이 받아 여섯 개 부문으로 나누고, 결과가 감사팀을 거쳐 산출물 1건으로 모인다.</desc>

<!-- ============================================================
     kjyoo.cloud 다이어그램 - The System
     v0.4 - 지시 1건이 여섯 부문을 거쳐 산출물 1건이 되는 흐름만 그린다.
     설비 레인(하네스/스킬/자동화)은 시스템 페이지의 별도 통계 섹션과
     내용이 중복되어 뺐다.

     디자인 규칙
     - 색, 서체 크기, 간격은 전부 CSS 토큰만 참조한다. 하드코딩 값은
       var() 의 폴백뿐이며 폴백은 라이트 모드 정본값과 동일하다.
     - 서체 크기는 16 / 19 / 23 세 단계만 쓴다. 간격은 4dp 스케일만 쓴다.
     - 강조 레드는 감사에서 산출물로 나가는 출력선과 산출물 상자
       테두리에만 쓴다.
============================================================ -->

<style>
.kjd-sys text { font-family: var(--kj-font, "Nanum Gothic", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); }
.kjd-sys .t-eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.6px; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-node    { font-size: 19px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-sub     { font-size: 16px; font-weight: 400; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-lane    { font-size: 16px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-card    { font-size: 19px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-cap     { font-size: 16px; font-weight: 400; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-out     { font-size: 19px; font-weight: 700; fill: var(--kj-accent, #E5002B); }
.kjd-sys .box       { fill: var(--kj-surface, #FFFFFF); stroke: var(--kj-border, rgba(0,0,0,0.08)); stroke-width: 1; }
.kjd-sys .box-out   { fill: var(--kj-surface, #FFFFFF); stroke: var(--kj-accent, #E5002B); stroke-width: 2; }
.kjd-sys .wire      { fill: none; stroke: var(--kj-text-3, #787878); stroke-width: 3; stroke-linecap: round; }
.kjd-sys .wire-out  { fill: none; stroke: var(--kj-accent, #E5002B); stroke-width: 5; stroke-linecap: round; }
.kjd-sys .rule      { stroke: var(--kj-divider, rgba(0,0,0,0.06)); stroke-width: 1; }
</style>

<!-- ========== 1단. 일이 도는 길 ========== -->
<text class="t-eyebrow" x="0" y="20" data-t="sys.band1">지시에서 산출까지</text>

<!-- 배선. 무채색 여러 갈래가 감사에서 모이고, 레드 출력선 1개가 나간다 -->
<g>
  <path class="wire" d="M152 156 H216"/>
  <path class="wire" d="M376 156 C408 156 408 66 440 66"/>
  <path class="wire" d="M376 156 C408 156 408 102 440 102"/>
  <path class="wire" d="M376 156 C408 156 408 138 440 138"/>
  <path class="wire" d="M376 156 C408 156 408 174 440 174"/>
  <path class="wire" d="M376 156 C408 156 408 210 440 210"/>
  <path class="wire" d="M376 156 C408 156 408 246 440 246"/>
  <path class="wire" d="M592 66 C624 66 624 156 656 156"/>
  <path class="wire" d="M592 102 C624 102 624 156 656 156"/>
  <path class="wire" d="M592 138 C624 138 624 156 656 156"/>
  <path class="wire" d="M592 174 C624 174 624 156 656 156"/>
  <path class="wire" d="M592 210 C624 210 624 156 656 156"/>
  <path class="wire" d="M592 246 C624 246 624 156 656 156"/>
  <path class="wire-out" d="M808 156 H872"/>
</g>

<!-- 지시 -->
<g>
  <rect class="box" x="0" y="108" width="152" height="96" rx="17"/>
  <text class="t-node" x="76" y="150" text-anchor="middle" data-t="sys.in.title">지시 1건</text>
  <text class="t-sub"  x="76" y="176" text-anchor="middle" data-t="sys.in.sub">사람이 내린다</text>
</g>

<!-- 총괄 기획실 -->
<g>
  <rect class="box" x="216" y="108" width="160" height="96" rx="17"/>
  <text class="t-node" x="296" y="150" text-anchor="middle" data-t="sys.chief.title">총괄 기획실</text>
  <text class="t-sub"  x="296" y="176" text-anchor="middle" data-t="sys.chief.sub">쪼개서 나눠준다</text>
</g>

<!-- 부문 6 -->
<g>
  <rect class="box" x="440" y="52"  width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="72"  text-anchor="middle" data-t="sys.dept.tech">기술</text>
  <rect class="box" x="440" y="88"  width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="108" text-anchor="middle" data-t="sys.dept.knowledge">지식</text>
  <rect class="box" x="440" y="124" width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="144" text-anchor="middle" data-t="sys.dept.creative">창작</text>
  <rect class="box" x="440" y="160" width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="180" text-anchor="middle" data-t="sys.dept.marketing">마케팅</text>
  <rect class="box" x="440" y="196" width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="216" text-anchor="middle" data-t="sys.dept.business">사업</text>
  <rect class="box" x="440" y="232" width="152" height="28" rx="14"/>
  <text class="t-lane" x="516" y="252" text-anchor="middle" data-t="sys.dept.intelligence">조사</text>
</g>
<text class="t-cap" x="516" y="288" text-anchor="middle" data-t="sys.dept.more">+ 실행, 상황실, 법률 전담 3종</text>

<!-- 감사 -->
<g>
  <rect class="box" x="656" y="108" width="152" height="96" rx="17"/>
  <text class="t-node" x="732" y="150" text-anchor="middle" data-t="sys.audit.title">감사팀</text>
  <text class="t-sub"  x="732" y="176" text-anchor="middle" data-t="sys.audit.sub">합격, 불합격</text>
</g>

<!-- 산출물 -->
<g>
  <rect class="box-out" x="872" y="108" width="160" height="96" rx="17"/>
  <text class="t-out" x="952" y="150" text-anchor="middle" data-t="sys.out.title">산출물 1건</text>
  <text class="t-sub" x="952" y="176" text-anchor="middle" data-t="sys.out.sub">사람이 최종 확인</text>
</g>

</svg>
