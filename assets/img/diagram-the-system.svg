<svg xmlns="http://www.w3.org/2000/svg" class="kjd kjd-sys" viewBox="-4 -4 1040 536" width="1040" height="536" role="img" aria-labelledby="kjdSysTitle kjdSysDesc">
<title id="kjdSysTitle">The System - 지시 1건이 산출물 1건이 되는 길</title>
<desc id="kjdSysDesc">지시 1건을 총괄 기획실이 받아 여섯 개 부문으로 나누고, 결과가 감사팀을 거쳐 산출물 1건으로 모인다. 그 아래에 하네스, 스킬, n8n 자동화가 상시 설비로 깔려 있다.</desc>

<!-- ============================================================
     kjyoo.cloud 다이어그램 - The System
     v0.2 (2026-09-03) / Creative 부문
     v0.1 대비 변경 2건. 그림 내용과 문구는 건드리지 않았다.
       1) viewBox 에 4px 여백을 넣었다. v0.1 은 viewBox 0 0 1032 540
          이라서 x=0 상자의 1px 테두리가 0.5px, x=1032 에 붙은
          산출물 상자의 2px 강조 테두리가 1px 잘려 나갔다.
          내부 좌표는 하나도 바꾸지 않고 원점만 -4 로 옮겼다.
       2) t-eyebrow 와 t-cap 의 색을 kj-text-3 에서 kj-text-2 로
          바꿨다. 라이트 모드에서 16px 글자가 대비 4.23 대 1 로
          WCAG AA 기준 4.5 대 1 에 미달했다. 신규 색을 만들지 않고
          이미 있는 토큰으로 옮겨 4.54 대 1 을 확보했다.

     정정 1건 (2026-09-03 확정)
       - "스킬 34종" 은 실측과 다르다. 세는 규칙은 최상위
         정해진 규칙 기준으로 실측 38종이다.
         card2.title 을 "스킬 38종" 으로, sys.source 캡션을
         "스킬 38종(2026-09-03 기준)" 으로 고쳤다. 그 외 좌표,
         색, 글자 크기, 다른 문구는 전혀 손대지 않았다.
       - 이 사본은 kjyoo-cloud 저장소 assets/img/ 에 둔다.
         v0.2 정본은 그대로 두었다(위 정정 미반영).

     정본: kjyoo_cloud_Brand_Foundation_v0.1.md
     - 색은 토큰만 참조한다. 하드코딩 값은 var() 의 폴백뿐이며
       폴백은 라이트 모드 정본값과 동일하다.
     - 서체 크기는 웹 5단계 중 16 / 19 / 23 만 쓴다.
     - 간격은 4dp 스케일(8 / 16 / 24 / 32 / 48 / 64)만 쓴다.
     - 라운드 17(카드), 999(pill).
     - 강조 레드는 감사에서 산출물로 나가는 출력선 1개와
       산출물 상자 테두리만 쓴다. 워드마크
       (무채색 여러 갈래 에서 레드 출력선 1개)의 직접 인용이다.
============================================================ -->

<style>
.kjd-sys text { font-family: var(--kj-font, "Nanum Gothic", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); }
.kjd-sys .t-eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.6px; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-node    { font-size: 19px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-sub     { font-size: 16px; font-weight: 400; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-lane    { font-size: 16px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-card    { font-size: 19px; font-weight: 700; fill: var(--kj-text, #383838); }
.kjd-sys .t-cap     { font-size: 16px; font-weight: 400; fill: var(--kj-text-2, #737373); }
.kjd-sys .t-out     { font-size: 19px; font-weight: 700; fill: var(--kj-accent, #E5002B); }
.kjd-sys .box       { fill: var(--kj-surface, #FFFFFF); stroke: var(--kj-border, rgba(0,0,0,0.08)); stroke-width: 1; }
.kjd-sys .box-out   { fill: var(--kj-surface, #FFFFFF); stroke: var(--kj-accent, #E5002B); stroke-width: 2; }
.kjd-sys .wire      { fill: none; stroke: var(--kj-text-3, #787878); stroke-width: 3; stroke-linecap: round; }
.kjd-sys .wire-out  { fill: none; stroke: var(--kj-accent, #E5002B); stroke-width: 5; stroke-linecap: round; }
.kjd-sys .rule      { stroke: var(--kj-divider, rgba(0,0,0,0.06)); stroke-width: 1; }
</style>

