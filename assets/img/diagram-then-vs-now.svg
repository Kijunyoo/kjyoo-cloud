<g>
  <rect class="box" x="580" y="192" width="124" height="84" rx="8"/>
  <path class="glyph-out" d="M630 214 H654"/>
  <text class="t-lane"  x="642" y="244" text-anchor="middle" data-t="tvn.dept.tech">기술</text>
