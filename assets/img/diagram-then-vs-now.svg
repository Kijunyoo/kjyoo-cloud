  <rect class="box" x="180" y="192" width="124" height="84" rx="8"/>
  <g class="glyph">
    <circle cx="218" cy="214" r="5"/><circle cx="234" cy="214" r="5"/>
    <circle cx="250" cy="214" r="5"/><circle cx="266" cy="214" r="5"/>
  </g>
  <text class="t-lane"  x="242" y="244" text-anchor="middle" data-t="tvn.then.r2.name">영업 마케팅</text>
  <text class="t-count" x="242" y="266" text-anchor="middle" data-t="tvn.then.r2.n">4명</text>

  <rect class="box" x="328" y="192" width="124" height="84" rx="8"/>
  <g class="glyph">
    <circle cx="382" cy="214" r="5"/><circle cx="398" cy="214" r="5"/>
  </g>
  <text class="t-lane"  x="390" y="244" text-anchor="middle" data-t="tvn.then.r3.name">해외 거점</text>
  <text class="t-count" x="390" y="266" text-anchor="middle" data-t="tvn.then.r3.n">2명</text>

  <rect class="box" x="32" y="292" width="124" height="84" rx="8"/>
  <circle class="glyph" cx="94" cy="314" r="5"/>
  <text class="t-lane"  x="94" y="344" text-anchor="middle" data-t="tvn.then.r4.name">대표</text>
  <text class="t-count" x="94" y="366" text-anchor="middle" data-t="tvn.then.r4.n">1명</text>

  <rect class="box" x="180" y="292" width="124" height="84" rx="8"/>
  <circle class="glyph" cx="242" cy="314" r="5"/>
  <text class="t-lane"  x="242" y="344" text-anchor="middle" data-t="tvn.then.r5.name">경영기획</text>
  <text class="t-count" x="242" y="366" text-anchor="middle" data-t="tvn.then.r5.n">1명</text>

  <rect class="box" x="328" y="292" width="124" height="84" rx="8"/>
  <circle class="glyph" cx="390" cy="314" r="5"/>
  <text class="t-lane"  x="390" y="344" text-anchor="middle" data-t="tvn.then.r6.name">디자인</text>
  <text class="t-count" x="390" y="366" text-anchor="middle" data-t="tvn.then.r6.n">1명</text>
</g>

<line class="rule" x1="32" y1="392" x2="452" y2="392"/>

<text class="t-metric" x="32" y="424" data-t="tvn.m1.label">조직 규모</text>
<text class="t-num" x="452" y="424" text-anchor="end" data-t="tvn.m1.then">10 ~ 17명</text>

<text class="t-metric" x="32" y="456" data-t="tvn.m2.label">마케팅과 영업</text>
<text class="t-num" x="452" y="456" text-anchor="end" data-t="tvn.m2.then">5 ~ 6명</text>

<text class="t-metric" x="32" y="488" data-t="tvn.m3.label">업무 갈래</text>
<text class="t-num" x="452" y="488" text-anchor="end" data-t="tvn.m3.then">7 ~ 9갈래</text>

<!-- ================= 가운데. 워드마크 ================= -->
<!-- 정본 기하 viewBox 0 0 64 48 을 0.875 배로만 축소했다 -->
<g transform="translate(488 239) scale(0.875)">
  <path class="mk-line" d="M4 8 H22 Q30 8 30 16 V24"/>
  <path class="mk-line" d="M4 24 H30"/>
  <path class="mk-line" d="M4 40 H22 Q30 40 30 32 V24"/>
  <path class="mk-out"  d="M30 24 H60"/>
</g>

<!-- ================= 오른쪽. NOW ================= -->
<rect class="panel" x="548" y="0" width="484" height="520" rx="17"/>

<text class="t-era-now" x="580" y="48" data-t="tvn.now.era">NOW</text>
<text class="t-h"   x="580" y="88"  data-t="tvn.now.h1">같은 분야를</text>
<text class="t-h"   x="580" y="118" data-t="tvn.now.h2">1명이 맡는다</text>
<text class="t-sub" x="580" y="146" data-t="tvn.now.sub">총괄 기획실이 나누고 감사가 검증한다</text>
<line class="rule" x1="580" y1="168" x2="1000" y2="168"/>

